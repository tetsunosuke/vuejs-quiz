<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>


    </head>
    <body>
        <div id="app">
        <div>
        <span name="text">{{ displayQuestion }}</span>
        <div v-if="!displayQuestion.includes('クイズ完了！')">
            <input type="button" v-for="char in availableChars" :key="char" :value="char" v-on:click="open">
        </div>
        </div>
        <div>
            <div v-if="!displayQuestion.includes('クイズ完了！')">
                <input type="text" name="query" v-model="query"></input>
                <input type="button" v-on:click="checkAnswer" value="解答する"></input>
            </div>
            <span>{{ result }}</span>
            <input type="button" v-on:click="nextQuestion" value="次の問題へ" v-if="result.includes('正解') && !displayQuestion.includes('クイズ完了！')"></input>
        </div>
        </div>
        <script src="js/app.js"></script>
    </body>
</html>
